[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "quality-runtime-agentscope"
version = "0.1.0"
requires-python = ">=3.11,<3.14"
dependencies = [
  "agentscope[service,storage-sql,storage-redis,rag,milvuslite]==2.0.8",
  "asyncpg>=0.29",
  "aiosqlite>=0.20",
  "jsonschema>=4.26,<5",
]

[project.optional-dependencies]
test = [
  "pytest>=9,<10",
]

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
