# Dedicated DSH composition for the code-governed native quality workflow.
- id: sdk-jsonrpc-server
  name: '@deepseek-ai/dsh-sdk-jsonrpc-server'

- id: agent-core
  name: '@deepseek-ai/dsh-agent-spine-demo'
  config:
    workspaceContext: false
    toolBash: false
    toolJobs: false
    skills:
      enabled: false

- id: llm-deepseek
  name: '@deepseek-ai/dsh-llm-deepseek'

- id: sessions
  name: '@deepseek-ai/dsh-session-persistence-jsonl'
  config:
    root: !!js process.env.DSH_SESSION_ROOT ?? './.sessions'

- id: session-checkpoints
  name: '@deepseek-ai/dsh-session-checkpoint-policy'

- id: mcp-quality-tools
  name: '@deepseek-ai/dsh-mcp-client'
  config:
    serverName: quality
    transport: streamable-http
    url: !!js process.env.QUALITY_TOOL_MCP_URL ?? 'http://127.0.0.1:8200/mcp/'
    failOnStartupError: true
    toolCallTimeoutMs: 30000

- id: native-quality-workflow
  name: !!js process.env.QUALITY_DSH_NATIVE_PLUGIN
  config:
    knowledgeTool: mcp__quality__knowledge_search
    ticketTool: mcp__quality__ticket_query
    smsTool: mcp__quality__sms_query
    appointmentTool: mcp__quality__appointment_query
