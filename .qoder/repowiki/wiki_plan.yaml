version: 1
scope:
  include: []
  exclude:
    - "node_modules/**"
    - "dist/**"
    - ".venv/**"
    - "**/__pycache__/**"
    - ".pytest_cache/**"
    - "public/avatars/**"
repowiki:
  template: "product_requirement"
  notes:
    - text: "项目为 AI 驱动的企业智能质量评价平台，V1 聚焦智能质检（坐席质检）。前端 Vite 7 + React 19 + TypeScript + Tailwind CSS v4 + shadcn/ui，后端 FastAPI + SQLAlchemy + Alembic。"
    - text: "导航结构已冻结：智能质检（质量总览/结果/坐席分析）、配置管理（任务/Agent/工作流/AI Resources/Data Resources/数据定义/结果规则）、Settings（Connections）。不新增一级入口。"
    - text: "冲突处理优先级：产品对象/业务语义以 Master 文档为准，页面/UI/交互以 Design Spec 为准，Route/状态/RBAC/Query/时间/分页以 Implementation Spec 为准。冻结基线文档位于 初始化doc/。"
    - text: "前端状态语义 token（neutral/info/success/warning/danger）颜色由主题变量管理，组件不硬编码 hex。URL Query 为列表状态唯一事实来源（react-router-dom v7）。"
    - text: "Agent 工作流 UI 使用 @xyflow/react，通用节点家族（AgentNodeKind）：input/llm/tool/transform/condition/router/human-interrupt/create-record/notification/end。"
    - text: "后端 RBAC：WF_API_TOKEN 环境变量设置后 /api/* 需要 Bearer token 鉴权。CORS 仅允许 localhost:5173。"
    - text: "资源管理一期将原 Tools/Models 入口统一收敛到 AI Resources 和 Data Resources，旧路由（/config/tools、/settings/models）重定向。"
    - text: "后端工作流引擎（Lightweight Workflow Kernel）包含 7 个 router 模块：workflows/registry/runs/business/resources/admin/agents，统一挂载在 FastAPI app。"
  documents:
    - title: "产品概述与导航"
      goal: "平台定位、V1 范围、冻结导航结构、冻结基线文档索引与冲突处理规则"
      parent: ""
    - title: "智能质检域"
      goal: "质量总览、质量结果列表/详情、坐席分析三个核心页面的功能规格、数据模型与交互流程"
      parent: ""
      hints: "覆盖 QualityResult/CriterionResult/TranscriptSegment/BusinessFact 等业务对象，以及人工复核流程"
    - title: "Agent 与工作流域"
      goal: "Agent 编辑器（节点图/Inspector/变量选择器/测试运行）、工作流设计器、Agent 版本管理与发布流程"
      parent: ""
      hints: "覆盖 EvaluationAgent/AgentDetail/AgentNodeDef/AgentEdgeDef，以及 Draft→Testing→Published→Deprecated 状态流转"
    - title: "资源管理域"
      goal: "AI Resources（Tools + Models）与 Data Resources 的统一资源模型、创建向导、详情展示、旧路由收敛"
      parent: ""
      hints: "覆盖 Tool/ToolDetail/DataAsset 类型，以及 ResWizard 按 scope 区分 ai/data 的复用模式"
    - title: "任务与执行域"
      goal: "分析任务 CRUD/调度、Run 执行记录、InteractionExecution 交互级执行、结果规则配置"
      parent: ""
      hints: "覆盖 AnalysisTask/Run/RunStatus/InteractionExecution/ResultRuleSet，以及 Task Wizard 创建流程"
    - title: "数据定义与结果规则"
      goal: "Data Definition 实体迭代（数据定义列表/编辑器）与 Result RuleSet（评分/风险/等级/派生标签）的配置规格"
      parent: ""
    - title: "前端架构与页面清单"
      goal: "src/ 目录结构、路由表（app.tsx 固定 Route Map）、组件分层（ui/app/quality/tasks/resources）、hooks/services 职责"
      parent: ""
      hints: "覆盖 lazy loading 策略、URL Query 状态管理（useListQuery）、mock-service 可替换 API 层"
    - title: "后端架构与 API"
      goal: "FastAPI 应用结构、7 个 router 模块职责、数据模型（models.py）、RBAC 鉴权、数据库迁移（Alembic）"
      parent: ""
      hints: "覆盖 server/app/ 目录，lifespan 初始化、worker 启动、CORS 配置"
    - title: "设计系统与交互规范"
      goal: "shadcn/ui 组件库使用规范、状态语义 token、Application Shell（sidebar-03）、表单/列表/详情交互模式"
      parent: ""
    - title: "测试与验证体系"
      goal: "后端 pytest 测试分层（test_phase_a/test_business/test_contracts/test_p2/test_p5_nodes/test_resources/test_runner/test_agent_runtime）、前端 E2E 脚本、typecheck/lint 流程"
      parent: ""
    - title: "研究与设计文档索引"
      goal: "docs/research/（轻量工作流系统研究 01-17）、docs/sdd/（SDD 四阶段）、uiux/（需求理解→需求→设计→前后端→验证→Agent Runtime）文档索引与阅读路径"
      parent: ""
knowledgecard:
  notes:
    - text: "业务对象体系以 domain/types.ts 为前端源头，server/app/models.py 为后端 ORM。核心实体：QualityResult（含 CriterionResult + TranscriptSegment + BusinessFact）、EvaluationAgent（含 AgentNodeDef 图）、Tool/ToolDetail、DataAsset、AnalysisTask、Run、InteractionExecution、ResultRuleSet。"
    - text: "前后端 API 契约：前端 services/（mock-service.ts、resource-api.ts、wf-api.ts）对应后端 routers/（workflows/registry/runs/business/resources/admin/agents）。ListResponse<T> 泛型分页，ListParams 统一 search/page/pageSize/sort/filters/tab。"
    - text: "组件库基于 shadcn/ui（new-york / neutral），位于 src/components/ui/。Application Shell 使用 sidebar-03 模式。状态语义色通过 StatusTone token 管理，禁止硬编码 hex。"
    - text: "Agent 运行时：后端 agent_runtime.py 负责节点执行，runner.py 负责 worker 调度。通用节点家族 AgentNodeKind 覆盖 input/llm/tool/transform/condition/router/human-interrupt/create-record/notification/end 十种。"
    - text: "版本管理贯穿多个实体：Agent（Draft→Testing→Published→Deprecated）、Tool（Draft→Published）、DataAsset（revision 递增 + Ready/Draft/Deprecated）、ResultRuleSet（Draft→Published）。所有版本含 publishedAt/publishedBy/versionNote。"
    - text: "执行与质量分离原则：Run/InteractionExecution 记录执行状态（SUCCESS/ERROR/SKIPPED），QualityResult/CriterionResult 记录业务质量结果（PASS/FAIL/N-A + severity + confidence），两者严格分离。"
